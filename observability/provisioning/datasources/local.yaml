apiVersion: 1
datasources:
  - name: Orpheus metrics
    uid: orpheus-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Orpheus events
    uid: orpheus-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
          datasourceUid: orpheus-tempo
          url: '$${__value.raw}'
  - name: Orpheus traces
    uid: orpheus-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
